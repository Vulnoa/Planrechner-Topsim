# Statische Sicherheitsanalyse des JavaScript-Codes durch GitHub (CodeQL)
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyse:
    name: Sicherheitsanalyse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          config: |
            paths-ignore:
              - vendor
              - js/app.bundle.js
      - uses: github/codeql-action/analyze@v3
